<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>养基发财</title>
    <!-- 字体：preconnect 提前握手 + stylesheet 并行加载（原 App.css @import 串行阻塞渲染）。
         Noto Sans SC 裁掉未使用的 300，补充实际大量使用的 600。 -->
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin />
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme_mode') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
