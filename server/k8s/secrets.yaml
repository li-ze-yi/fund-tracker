# Kubernetes Secret —— 后端凭据
#
# 对应 deployment-web.yaml 中引用的两个 Secret：
#   - fund-backend-secrets：必填的 MySQL 连接 + JWT 密钥
#   - redis：可选，配 Redis 后启用（驱动共享缓存/BullMQ 队列/跨实例单飞聚合）
#
# 引用方式一：stringData（本文件，明文便于阅读，apply 后 K8s 自动 base64 编码存储）。
# 引用方式二（推荐）：kubectl create secret generic，见文件末尾命令。
#
# [注意] 切勿把真实密钥提交进版本库！本文件为模板，请替换为真实值后再 apply，
#         或改用 kubectl create secret（值不进文件、更安全）。
apiVersion: v1
kind: Secret
metadata:
  name: fund-backend-secrets
  namespace: default
type: Opaque
stringData:
  # 必填：JWT 签名密钥（至少 32 字符，生成命令：
  #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))")
  JWT_SECRET: "your-strong-random-secret-at-least-32-chars"
  # 必填：MySQL 连接（config/database.js 读取 host/user/password/database）
  MYSQL_HOST: "your-mysql-host"
  MYSQL_USER: "your-mysql-user"
  MYSQL_PASSWORD: "your-mysql-password"
  MYSQL_DATABASE: "real_time"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis
  namespace: default
type: Opaque
stringData:
  # 可选：Redis 连接串（redis://[user:pass@]host:port/db，需 Redis 6.2+）
  # 若 Redis 开启了密码认证，格式为 redis://:yourpassword@host:port/db（user 留空用 ":"）。
  # 未配置时后端回退为单进程模式（内存+文件缓存、进程内定时任务）
  REDIS_URL: "redis://:CHANGE_ME_PASSWORD@redis-svc:6379/0"